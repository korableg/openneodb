name: Russia GPS database

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: russia-gps-database
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Build and publish database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install converter
        run: python -m pip install .
      - name: Generate database and archive
        id: database
        run: |
          set -euo pipefail
          release_date=$(date -u +%F)
          database_date=$(date -u -d "$release_date" +%d%m%y)
          curl --fail --show-error --silent --location \
            --connect-timeout 30 --max-time 300 \
            https://speedcamonline.ru/cg77/Rus \
            | neodb cityguide --date "$database_date" -o X-COP_9000c_Baza_GPS.db
          python - <<'PY'
          from pathlib import Path
          from openneodb import NeolineDBWriter

          if Path("X-COP_9000c_Baza_GPS.db").stat().st_size <= NeolineDBWriter.HEADER_SIZE:
              raise SystemExit("Generated database contains no camera records")
          PY
          archive="neoline_x-cop_9000c_russia_${release_date}.zip"
          zip "$archive" X-COP_9000c_Baza_GPS.db
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
          echo "release_tag=russia-$release_date" >> "$GITHUB_OUTPUT"
      - name: Publish dated database
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_COMMIT: ${{ github.sha }}
          ARCHIVE: ${{ steps.database.outputs.archive }}
          RELEASE_TAG: ${{ steps.database.outputs.release_tag }}
          RELEASE_DATE: ${{ steps.database.outputs.release_date }}
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/russia-release-error.txt"
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" \
              > /dev/null 2> "$error_file"; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest \
              --title "Russia GPS database $RELEASE_DATE"
          elif [[ "$(cat "$error_file")" == *"(HTTP 404)"* ]]; then
            gh release create "$RELEASE_TAG" "$ARCHIVE" \
              --target "$TARGET_COMMIT" \
              --title "Russia GPS database $RELEASE_DATE" \
              --notes "Daily Russia camera database for Neoline X-COP 9000c." \
              --latest
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Update russia_latest tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.database.outputs.release_tag }}
        run: |
          set -euo pipefail
          tag_object=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          error_file="$RUNNER_TEMP/russia-latest-ref-error.txt"
          if gh api "repos/$GH_REPO/git/ref/tags/russia_latest" \
              > /dev/null 2> "$error_file"; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/russia_latest" \
              -f sha="$tag_object" -F force=true
          elif [[ "$(cat "$error_file")" == *"(HTTP 404)"* ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/russia_latest -f sha="$tag_object"
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Remove dated releases older than 30 days
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.database.outputs.release_tag }}
        run: |
          set -euo pipefail
          releases_file="$RUNNER_TEMP/russia-releases.json"
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" \
            > "$releases_file"
          python - "$releases_file" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from datetime import date, datetime, timedelta, timezone

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(days=30)
          with open(sys.argv[1]) as source:
              pages = json.load(source)
          for page in pages:
              for release in page:
                  tag = release["tag_name"]
                  if (
                      not re.fullmatch(r"russia-[0-9]{4}-[0-9]{2}-[0-9]{2}", tag)
                      or tag == os.environ["RELEASE_TAG"]
                      or release["draft"]
                      or release["prerelease"]
                      or not release["published_at"]
                  ):
                      continue
                  try:
                      release_date = date.fromisoformat(tag.removeprefix("russia-"))
                  except ValueError:
                      continue
                  published_at = datetime.fromisoformat(
                      release["published_at"].replace("Z", "+00:00")
                  )
                  if release_date > now.date() or published_at >= cutoff:
                      continue
                  subprocess.run(
                      ["gh", "release", "delete", tag, "--cleanup-tag", "--yes"],
                      check=True,
                  )
          PY
